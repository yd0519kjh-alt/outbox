name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 코드가 main 브랜치에 푸시될 때마다 자동으로 배포를 시작합니다.

permissions:
  contents: write  # 배포용 브랜치(gh-pages)에 파일을 쓸 권한을 부여합니다.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build
        env:
          # 중요: 깃허브 금고(Secrets)에서 키를 꺼내와 리액트 빌드 환경에 주입합니다.
          # 이 설정이 있어야 배포된 사이트에서 API가 작동합니다.
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_OPENAI_API_KEY: ${{ secrets.REACT_APP_OPENAI_API_KEY }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build  # npm run build로 생성된 결과물 폴더를 배포합니다.
          branch: gh-pages  # 배포용 파일들이 저장될 브랜치 이름입니다.